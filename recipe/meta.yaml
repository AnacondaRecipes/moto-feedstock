{% set name = "moto" %}
{% set version = "5.2.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: aac8023a429e125e91c91f8f4730a67b54f518cda587352f7e67252fe3168f75

build:
  number: 2
  skip: true  # [py<310]
  entry_points:
    - moto_server = moto.server:main
    - moto_proxy = moto.proxy:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  script_env:
    # Tests require a valid CA bundle with the path to certificates.
    # - REQUESTS_CA_BUNDLE=/ssl/cacert.pem

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=40.6.0
  run:
    - python
    - boto3 >=1.9.201
    - botocore >=1.20.88,!=1.35.45,!=1.35.46
    - cryptography >=35.0.0
    - requests >=2.5
    - xmltodict
    - werkzeug >=0.5,!=2.2.0,!=2.2.1
    - responses >=0.15.0,!=0.25.5
  run_constrained:
    - joserfc >=0.9.0
    - docker-py >=3.0.0
    - pyyaml >=5.1
    - cfn-lint >=0.40.0
    - openapi-spec-validator >=0.5.0
    - pyparsing >=3.0.7
    - py-partiql-parser ==0.6.3
    - aws-xray-sdk !=0.96,>=0.93
    - flask !=2.2.0,!=2.2.1

test:
  files:
    - run_imports.py
  # imports section moved to run_imports.py, because starts from botocore 1.43.68,
  # it is required certificates, and REQUESTS_CA_BUNDLE environment variable.
  # This variable should be set just before imports, so script_env doesn't work.
  # Current solution is to set REQUESTS_CA_BUNDLE in commands section, and then run imports.
  imports:
  requires:
    - pip
    - pyparsing
    - joserfc
    - flask
    - flask_cors
    - openapi-spec-validator
    - aws-xray-sdk
    - multipart
    # Tests require a valid CA bundle with the path to certificates.
    # ca-certificates contains needed certificates.
    - ca-certificates
  commands:
    - export REQUESTS_CA_BUNDLE=$PREFIX/ssl/cacert.pem  # [not win]
    - set "REQUESTS_CA_BUNDLE=%PREFIX%\Library\ssl\cacert.pem"  # [win]
    - python run_imports.py
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - moto_server --help
    - moto_proxy --help

about:
  home: https://docs.getmoto.org
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: A library that allows your python tests to easily mock out the boto library.
  description: A library that allows you to easily mock out tests based on AWS infrastructure.
  doc_url: https://docs.getmoto.org
  dev_url: https://github.com/getmoto/moto

extra:
  recipe-maintainers:
    - jan-janssen
    - johanneskoester
    - mariusvniekerk
    - hajapy
  skip-lints:
    - missing_pip_check
